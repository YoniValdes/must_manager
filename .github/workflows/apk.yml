# Compila la APK firmada en los servidores de GitHub, con el mismo android/build.ps1 que en el PC.
# Se lanza a mano: pestaña Actions → "Compilar APK" → Run workflow (elige la rama: main o apagon).
# La APK sale como "artifact" (zip descargable) en la página de esa ejecución, durante 30 días.
#
# La llave de firma viene de dos secrets cifrados del repo (Settings → Secrets and variables → Actions):
#   KEYSTORE_B64       = secretos\mustmanager.keystore en base64
#   KEYSTORE_PASSWORD  = contenido de secretos\firma.txt
# GitHub no pasa los secrets a los Pull Requests que vienen de forks, y este workflow no se ejecuta en PRs.
name: Compilar APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publicar como Release (página pública de descarga). Solo desde main y con una versión nueva."
        type: boolean
        default: false

permissions:
  contents: write # solo para crear la Release (etiqueta vX.Y + APK); el resto solo lee

jobs:
  apk:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Herramientas de Android (build-tools 35 y android-34)
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          if (-not (Test-Path "$sdk\build-tools\35.0.0\aapt2.exe") -or -not (Test-Path "$sdk\platforms\android-34\android.jar")) {
            "y`ny`ny`ny`ny`n" | & "$sdk\cmdline-tools\latest\bin\sdkmanager.bat" "build-tools;35.0.0" "platforms;android-34" | Out-Null
          }
          Test-Path "$sdk\build-tools\35.0.0\aapt2.exe"
          Test-Path "$sdk\platforms\android-34\android.jar"

      - name: Llave de firma (desde los secrets)
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Sin llave, build.ps1 crearía una nueva y esa APK no podría actualizar la app instalada: se para aquí.
          if (-not $env:KEYSTORE_B64 -or -not $env:KEYSTORE_PASSWORD) {
            throw "Faltan los secrets KEYSTORE_B64 y KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions)."
          }
          New-Item -ItemType Directory -Force secretos | Out-Null
          [IO.File]::WriteAllBytes("$PWD\secretos\mustmanager.keystore", [Convert]::FromBase64String($env:KEYSTORE_B64))
          Set-Content -Path secretos\firma.txt -Value $env:KEYSTORE_PASSWORD -NoNewline

      - name: Compilar (android/build.ps1)
        shell: pwsh
        run: .\android\build.ps1

      - name: Comprobar que la firma es la de siempre
        shell: pwsh
        run: |
          $apk = Get-ChildItem dist\*.apk | Select-Object -First 1
          & "$env:ANDROID_HOME\build-tools\35.0.0\apksigner.bat" verify --print-certs $apk.FullName | Select-String "SHA-256"

      - name: Borrar la llave del servidor
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force secretos -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: MustManager-${{ github.ref_name }}-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      # ---------------------------------------------------------------- Release (casilla marcada)
      - name: Publicar la Release
        if: ${{ inputs.release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref_name }}" -ne "main") { throw "Las Releases solo se publican desde main (has elegido ${{ github.ref_name }})." }
          $ver = [regex]::Match((Get-Content android\AndroidManifest.xml -Raw), 'versionName="([^"]+)"').Groups[1].Value
          $tag = "v$ver"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Ya existe la Release $tag. Sube versionCode y versionName en AndroidManifest.xml (y añade sus novedades a changelog.js)." }
          # Novedades: la entrada de changelog.js con esta versión (las mismas que ve el usuario en la app).
          $notes = node -e "
            const vm = require('vm'), fs = require('fs'), ctx = { window: {} };
            vm.runInNewContext(fs.readFileSync('app/changelog.js', 'utf8'), ctx);
            const e = (ctx.window.CHANGELOG || []).find(x => x.version === process.argv[1]);
            if (!e) { console.error('changelog.js no tiene la versión ' + process.argv[1]); process.exit(1); }
            const tag = { new: 'Nuevo', fix: 'Corregido', imp: 'Mejorado' };
            console.log('## Novedades\n');
            e.items.forEach(i => console.log('- **' + (tag[i[0]] || i[0]) + ':** ' + i[1]));
          " $ver
          if ($LASTEXITCODE -ne 0) { throw "Sin novedades para la versión $ver en app/changelog.js." }
          $apk = (Get-ChildItem dist\*.apk | Select-Object -First 1).FullName
          $body = ($notes -join "`n") + @"


          ## Cómo instalarla

          1. Descarga **$(Split-Path $apk -Leaf)** (abajo, en *Assets*) desde la tablet o el móvil.
          2. Ábrela e instálala. Si Android lo pide, permite instalar apps de esa fuente.
          3. Si ya tenías Must Manager, se actualiza **sin perder el historial**. Después, pulsa **Conectar**.

          Cierra **BMS tools** antes de conectar. App no oficial, sin relación con MUST Power.

          <sub>Huella del certificado (SHA-256): ``3a2237683e7caf1293a0447ab3ec3fa4ac4d85bb4ba6ece8d726d9cdc7fb0dee``</sub>
          "@
          Set-Content release-notes.md $body -Encoding utf8
          gh release create $tag $apk --target "${{ github.sha }}" --title "Must Manager $ver" --notes-file release-notes.md
          "Publicada: https://github.com/${{ github.repository }}/releases/tag/$tag"
